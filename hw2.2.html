<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>

    .task{
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 500px;
      background-color: bisque;
    }
    .square{
      height: 100px;
      width: 100px;
      background-color: red;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      flex-direction: row;
      border: 1px solid black;

    }
    .square:hover{
      border-radius: 50%;
      background-color: gray;
      transition: 2s;
    }
  </style>
</head>
<body>
<div class="task">
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
</div>
</body>
</html>
